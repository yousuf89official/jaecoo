services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jaecoo
      POSTGRES_USER: jaecoo
      POSTGRES_PASSWORD: jaecoo_local_only
    ports:
      - "54329:5432"
    volumes:
      - jaecoo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaecoo -d jaecoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgres://jaecoo:jaecoo_local_only@postgres:5432/jaecoo
    ports:
      - "4181:4173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jaecoo_pg:
